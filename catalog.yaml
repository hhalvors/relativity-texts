  # translations of Reichenbach (1965) and Schlick (1979) are in copyright.
  - id: a-priori
    title: "Relativity and the a priori, 1917–1922"
    note: >
      Schlick's Raum und Zeit in der gegenwärtigen Physik (1917) gave the first
      philosophical account of the general theory. Reichenbach (1920) and Cassirer (1921) asked what the theory of relativity
      leaves of the Kantian a priori. Schlick answered Cassirer's book in
      Kant-Studien (1921) with an empiricist reading of the new physics against
      Cassirer's critical one, and Reichenbach surveyed the state of the
      philosophical discussion in Logos (1922).
    papers:

