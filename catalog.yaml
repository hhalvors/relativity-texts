        year: "1910"
        venue: "Annalen der Physik 336 [4. Folge 31]"
        source: "Annalen der Physik 336 [4. Folge 31] (1910): 393–415"
        publish: true
        phase: 1
        sections:
          - title: "Complete article (pp. 393–415)"
            status: to-do
            links: []

  - id: noether-fritz
    name: "Fritz Noether"
    dates: "1884–1941"
    bio: >
