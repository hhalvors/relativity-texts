# Relativity Texts — Catalog
#
# Transcriptions and English translations of early papers on relativity theory,
# beginning with the rigid-body papers of 1909–1911. One record per paper.
#
# The schema is the danish-texts one (~/danish-texts/catalog.yaml, checked against
# ~/hhalvors.github.io/DanishTexts.hs), so a trimmed copy of that generator can read it.
# Required keys:  Author: id, name, dates, bio, works
#                 Work:   id, title, year, sections      (venue, note optional)
#                 Section: title, status, links (use `links: []` when empty)
# Extra keys for this repo (unknown keys are ignored by the danish-texts parser):
#   title_en   English title (sentence case in reference lists)
#   source     full citation of the printing transcribed
#   publish    true | false. false keeps the work's PDFs off GitHub Pages and the site:
#              list its texts/<author>/<slug> in PRIVATE in the Makefile as well.
#              (Hans, 2026-10-20: all five first-phase papers are published.)
#   phase      1 = the first-phase corpus; 2 = listed for later, not started.
# Status values: complete | in-progress | to-do
# A `note` describes the work (what it argues, its place in the debate), never our method.
# Run `python3 validate-catalog.py` before handing this file back.

authors:

  - id: ehrenfest
    name: "Paul Ehrenfest"
    dates: "1880–1933"
    bio: >
      Austrian-Dutch theoretical physicist. He wrote these papers in
      St. Petersburg, before succeeding Lorentz at Leiden in 1912.
    works:
      - id: rotation-1909
        title: "Gleichförmige Rotation starrer Körper und Relativitätstheorie"
        title_en: "Uniform rotation of rigid bodies and the theory of relativity"
        year: "1909"
        venue: "Physikalische Zeitschrift 10"
        source: "Physikalische Zeitschrift 10 (1909): 918"
        publish: true
        phase: 1
        note: >
          A one-page note arguing that relativistic rigidity cannot be
          maintained for a cylinder set into uniform rotation: its periphery
          should contract while its radius should not. The origin of what
          became known as the Ehrenfest paradox.
        sections:
          - title: "Complete article (p. 918)"
            status: in-progress
            links: []
      - id: ignatowsky-1910
        title: "Zu Herrn v. Ignatowskys Behandlung der Bornschen Starrheitsdefinition"
        year: "1910"
        venue: "Physikalische Zeitschrift 11"
        source: "Physikalische Zeitschrift 11 (1910): 1127–1129"
        publish: true
        phase: 2
        sections:
          - title: "Complete article (pp. 1127–1129)"
            status: to-do
            links: []
      - id: ignatowsky-1911
        title: "Zu Herrn v. Ignatowskys Behandlung der Bornschen Starrheitsdefinition II"
        year: "1911"
        venue: "Physikalische Zeitschrift 12"
        source: "Physikalische Zeitschrift 12 (1911): 412–413"
        publish: true
        phase: 2
        sections:
          - title: "Complete article (pp. 412–413)"
            status: to-do
            links: []

  - id: laue
    name: "Max von Laue"
    dates: "1879–1960"
    bio: >
      German physicist, Nobel laureate in 1914 for the diffraction of X-rays
      by crystals, and author of the first textbook of the special theory of
      relativity, »Das Relativitätsprinzip« (1911).
    works:
      - id: starrer-koerper-1911
        title: "Zur Diskussion über den starren Körper in der Relativitätstheorie"
        title_en: "On the discussion of the rigid body in the theory of relativity"
        year: "1911"
        venue: "Physikalische Zeitschrift 12"
        source: "Physikalische Zeitschrift 12 (1911): 85–87"
        publish: true
        phase: 1
        sections:
          - title: "Complete article (pp. 85–87)"
            status: in-progress
            links: []

  - id: herglotz
    name: "Gustav Herglotz"
    dates: "1881–1953"
    bio: >
      German mathematician, professor at Leipzig and later at Göttingen.
    works:
      - id: starr-1910
        title: "Über den vom Standpunkt des Relativitätsprinzips aus als „starr“ zu bezeichnenden Körper"
