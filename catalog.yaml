# Relativity Texts — Catalog
#
# Transcriptions and English translations of early papers on relativity theory,
# arranged by TOPIC, not by author (Hans, 2026-10-20). Tentative cutoff: papers
# published before 1970 (Hans, 2026-10-22). One record per paper,
# listed under its topic in the order the page shows them (chronological).
#
# This file drives the /relativity/ page of hanshalvorson.com: it is symlinked as
# ~/hhalvors.github.io/data/relativity-texts.yaml and rendered by RelativityTexts.hs
# there. Publish with ~/hhalvors.github.io/publish-relativity.sh "message".
#
# Topic:  id (= the directory texts/<id>/), title, note (optional), papers
# Paper:  id          the directory texts/<topic>/<id>/, <author>-<year>
#         author      the author's name as it should appear
#         dates       the author's dates (optional)
#         title       the original title, as printed
#         title-en    English title, sentence case (optional; required for phase 1)
#         year
#         source      full citation of the printing transcribed
#         note        two or three sentences on the paper itself (optional; never our method)
#         status      complete | in-progress | to-do | in-copyright (listed with a link
#                     to an online copy, never transcribed; no title-en needed)
#         links       [{label, url}]; use `links: []` when empty
#         publish     true | false. false leaves the paper off the site page; also list
#                     texts/<topic>/<id> in PRIVATE in the Makefile, which keeps its PDFs
#                     out of `make public`. (Hans, 2026-10-20: all published.)
#         phase       1 = being edited now; 2 = listed for later (shown under "Planned")
# Links: the original wherever it is online (Hans, 2026-10-20) -- the journal's DOI
#   ("Journal (Wiley)"), the Internet Archive scan opened at the paper's first page
#   (page/n<PDF page - 1> of the issue scan; checked against IA's scandata), Wikisource.
# When a paper is finished: status complete, and Transcription/Translation links first:
#   https://hhalvors.github.io/relativity-texts/texts/<topic>/<id>/<file>.pdf
# Run `python3 validate-catalog.py` (or `make check`) before handing this file back.

topics:

  - id: extended-bodies
    title: "No-go theorems for extended bodies"
    note: >
      Born (1909) proposed a definition of the rigid body suited to the theory of
      relativity. Ehrenfest (1909) showed that a body rigid in this sense cannot be
      set into uniform rotation; Herglotz and Noether (1910) showed that the
      definition leaves a body only three degrees of freedom; and Laue (1911) argued
      that, since no action propagates faster than light, no body can have a finite
      number of degrees of freedom.
    papers:

      - id: born-1909
        author: "Max Born"
        dates: "1882–1970"
        title: "Die Theorie des starren Elektrons in der Kinematik des Relativitätsprinzips"
        title-en: "The theory of the rigid electron in the kinematics of the principle of relativity"
        year: "1909"
        source: "Annalen der Physik 335 [4. Folge 30] (1909): 1–56"
        status: to-do
        links:
          - label: "Journal (Wiley)"
            url: "https://doi.org/10.1002/andp.19093351102"
          - label: "Scan (Internet Archive)"
            url: "https://archive.org/details/sim_annalen-der-physik_1909_30_11/page/n8"
        publish: true
        phase: 1

      - id: ehrenfest-1909
        author: "Paul Ehrenfest"
        dates: "1880–1933"
        title: "Gleichförmige Rotation starrer Körper und Relativitätstheorie"
        title-en: "Uniform rotation of rigid bodies and the theory of relativity"
        year: "1909"
        source: "Physikalische Zeitschrift 10 (1909): 918"
        note: >
          A one-page note arguing that relativistic rigidity cannot be maintained
          for a cylinder set into uniform rotation: its periphery should contract
          while its radius should not. The origin of what became known as the
          Ehrenfest paradox.
        status: complete
        links:
          - label: "Transcription"
            url: "https://hhalvors.github.io/relativity-texts/texts/extended-bodies/ehrenfest-1909/transcription.pdf"
          - label: "Translation"
            url: "https://hhalvors.github.io/relativity-texts/texts/extended-bodies/ehrenfest-1909/translation.pdf"
          - label: "Scan (Internet Archive)"
            url: "https://archive.org/details/per_physikalische-zeitschrift_physikalische-zeitschrift_1909-11-22_23/page/n53"
          - label: "Wikisource"
            url: "https://de.wikisource.org/wiki/Gleichf%C3%B6rmige_Rotation_starrer_K%C3%B6rper_und_Relativit%C3%A4tstheorie"
        publish: true
        phase: 1

      - id: herglotz-1910
        author: "Gustav Herglotz"
        dates: "1881–1953"
        title: "Über den vom Standpunkt des Relativitätsprinzips aus als „starr“ zu bezeichnenden Körper"
        title-en: "On the body to be described as “rigid” from the standpoint of the principle of relativity"
        year: "1910"
        source: "Annalen der Physik 336 [4. Folge 31] (1910): 393–415"
        status: to-do
